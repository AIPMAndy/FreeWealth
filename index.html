<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeWealth · 财富实验室</title><meta name="description" content="AI 酋长 Andy 发起的科学财富研究开源项目，用可验证的商业实验、数学模型和财富模拟器研究个人财富自由。"><style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f6f4;color:#161616}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:48px 24px}header{border-bottom:1px solid #d7d7d2;padding-bottom:26px}h1{font-size:clamp(38px,7vw,74px);letter-spacing:-.06em;margin:0 0 10px}h2{font-size:22px;letter-spacing:-.02em}p{line-height:1.65;color:#5c5c57}small{color:#686863;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label,.metric{display:block;background:white;border:1px solid #e0e0db;border-radius:12px;padding:14px}label span{display:block;font-size:13px;font-weight:600;margin-bottom:7px}input{width:100%;border:1px solid #ccc;border-radius:7px;padding:10px;font-size:17px;background:#fff;color:#151515}.metric b{display:block;font-size:26px;margin-top:9px;font-variant-numeric:tabular-nums}.metric.primary{background:#20201f;color:#fff;border:0}.metric.primary small{color:#ccc}a{color:inherit}#message{min-height:28px;color:#a34125}footer{margin-top:32px;border-top:1px solid #ddd;padding-top:15px}button{border:1px solid #bbb;background:white;color:#222;border-radius:8px;padding:9px 14px;cursor:pointer}input:focus,button:focus{outline:2px solid #54739b;outline-offset:2px}nav{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px}nav a{font-size:14px;text-underline-offset:4px}</style></head><body><main><header><small>FREEWEALTH / RESEARCH LAB 01</small><h1>财富实验室</h1><p>用可计算的商业模型，把流量、付费、成本与时间连接起来。以下均为演示假设，不代表真实业绩或收入预测。</p><nav aria-label="研究资料"><a href="https://github.com/AIPMAndy/FreeWealth">GitHub 开源</a><a href="https://github.com/AIPMAndy/FreeWealth/blob/main/docs/science-map.md">20 个科学模型</a><a href="https://github.com/AIPMAndy/FreeWealth/blob/main/docs/30-day-playbook.md">30 天行动计划</a></nav></header><section><h2>01 / 输入单月情景</h2><div class="grid" id="inputs"></div><p><button id="reset" type="button">重置示例</button></p></section><section><h2>02 / 模拟结果</h2><div class="grid" id="results" aria-live="polite"></div><p id="message" role="status"></p><small>订单为期望值，可为小数。变动成本按可履约订单计算（包含退款订单的平均成本）；未单列所得税、融资、折旧和回款时差。经营结余不是现金流。所有输入仅在本页内存中使用，不上传。</small></section><footer><a href="https://metaver.vip/">AI 酋长 Andy · 项目发起品牌</a>　·　<a href="https://github.com/AIPMAndy/FreeWealth/blob/main/docs/science-map.md">科学模型地图</a>　·　<a href="https://github.com/AIPMAndy/FreeWealth/blob/main/docs/research-protocol.md">研究协议</a>　·　<a href="https://github.com/AIPMAndy/FreeWealth/blob/main/experiments/registry.csv">实验台账</a></footer></main><script src="model.js"></script><script>
const fields=[['reach','有效曝光（人次/按固定去重口径）',100000,1],['leadRate','合格线索率（%）',1,.1],['closeRate','付费转化率（%）',5,.1],['price','平均客单价（元）',1000,1],['refundRate','退款比例（%）',5,.1],['variableCost','每订单变动成本（元）',100,1],['acquisition','归因获客费用（元）',2000,1],['fixedCost','固定运营费用（元）',3000,1],['fixedHours','固定运营人工（小时）',20,.5],['hoursPerOrder','每订单人工（小时）',2,.1],['availableHours','可用人工（小时）',100,.5]];const inputs=document.getElementById('inputs'),results=document.getElementById('results'),msg=document.getElementById('message');for(const [id,label,value,step] of fields){const el=document.createElement('label');const span=document.createElement('span');span.textContent=label;const input=document.createElement('input');input.type='number';input.id=id;input.min='0';input.step=step;input.value=value;if(id.endsWith('Rate'))input.max='100';el.append(span,input);inputs.append(el);input.addEventListener('input',render)}const fmt=new Intl.NumberFormat('zh-CN',{maximumFractionDigits:1});function render(){try{const p=Object.fromEntries(fields.map(([id])=>[id,document.getElementById(id).valueAsNumber]));const r=FreeWealth.calculate(p);const metrics=[['净营收','¥'+fmt.format(r.revenue)],['贡献利润','¥'+fmt.format(r.contribution)],['经营结余（简化）','¥'+fmt.format(r.operating)],['每人工小时贡献',r.perHour===null?'—':'¥'+fmt.format(r.perHour)],['需求 / 可履约订单',fmt.format(r.demand)+' / '+fmt.format(r.orders)],['所需人工（小时）',fmt.format(r.hours)]];results.replaceChildren();metrics.forEach(([k,v],i)=>{const el=document.createElement('div');el.className='metric'+(i===1?' primary':'');const a=document.createElement('small');a.textContent=k;const b=document.createElement('b');b.textContent=v;el.append(a,b);results.append(el)});msg.textContent=r.infeasible?'固定运营工时已超过总可用工时，情景不可行。':r.unserved>0?'产能瓶颈：约 '+fmt.format(r.unserved)+' 个期望订单无法履约。':'在当前假设下未超过可用工时。'}catch(e){results.replaceChildren();msg.textContent=e.message}}document.getElementById('reset').addEventListener('click',()=>{fields.forEach(([id,,value])=>document.getElementById(id).value=value);render()});render();</script></body></html>
